name: CEA Radar — Scraping Diário

on:
  schedule:
    # Roda todo dia às 11:00 UTC = 08:00 horário de Manaus (UTC-3)
    - cron: "0 11 * * 1-5"   # segunda a sexta
  workflow_dispatch:           # permite rodar manualmente pelo GitHub

jobs:
  scraping:
    runs-on: ubuntu-latest

    permissions:
      contents: write          # necessário para fazer commit do JSON

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Executar scraping
        run: python scraper.py

      - name: Salvar JSON no repositório
        run: |
          git config user.name  "cea-radar-bot"
          git config user.email "bot@cea-radar.com"
          git add data/publicacoes.json
          git diff --cached --quiet || git commit -m "📰 Atualização diária — $(date +'%d/%m/%Y %H:%M')"
          git push
